name: Build Android app

# Builds the Warehouse Hub Android APKs on a GitHub runner (the Android SDK can't
# run in the Linux container the web app is developed in). One APK per brand —
# Calibre and Razoryn — each with its own icon, name and live URL. The app is a
# thin native shell that loads the live site, so these APKs rarely need
# rebuilding; the web app updates automatically because the shell always loads the
# latest deployed site.
#
# Trigger: push a tag like `android-v1.0.0`, or run manually from the Actions tab
# (optionally pick a single brand). Each brand's APK is attached to the run as an
# artifact you can download and sideload onto the JR-927M devices.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      brand:
        description: 'Which brand(s) to build'
        type: choice
        default: both
        options: [both, calibre, razoryn]

permissions:
  contents: write

jobs:
  # Resolve the brand matrix from the manual choice (default: both brands).
  matrix:
    runs-on: ubuntu-latest
    outputs:
      brands: ${{ steps.pick.outputs.brands }}
    steps:
      - id: pick
        run: |
          B='${{ github.event.inputs.brand }}'
          if [ "$B" = "calibre" ]; then echo 'brands=["calibre"]' >> "$GITHUB_OUTPUT";
          elif [ "$B" = "razoryn" ]; then echo 'brands=["razoryn"]' >> "$GITHUB_OUTPUT";
          else echo 'brands=["calibre","razoryn"]' >> "$GITHUB_OUTPUT"; fi

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.matrix.outputs.brands) }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        run: npm install

      - name: Prepare brand (config + icon)
        run: node scripts/prepare.js ${{ matrix.brand }}

      - name: Add Android platform
        run: npx cap add android

      - name: Add Firebase config for native push (optional)
        # Native FCM push needs a google-services.json per brand, added as a repo
        # secret (base64). Name the secret GOOGLE_SERVICES_JSON_CALIBRE /
        # GOOGLE_SERVICES_JSON_RAZORYN. If absent, the app still builds — it just
        # won't have native push until the secret is added.
        env:
          GS_CALIBRE: ${{ secrets.GOOGLE_SERVICES_JSON_CALIBRE }}
          GS_RAZORYN: ${{ secrets.GOOGLE_SERVICES_JSON_RAZORYN }}
        run: |
          if [ "${{ matrix.brand }}" = "calibre" ]; then SECRET="$GS_CALIBRE"; else SECRET="$GS_RAZORYN"; fi
          if [ -n "$SECRET" ]; then
            echo "$SECRET" | base64 -d > android/app/google-services.json
            # Apply the Google Services Gradle plugin so the JSON is processed.
            # (Capacitor doesn't add this automatically.) Patch the generated
            # project: add the classpath to the buildscript, apply the plugin.
            sed -i "0,/dependencies {/s//dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
            echo "google-services.json + Gradle plugin added for ${{ matrix.brand }}"
          else
            echo "No google-services.json secret for ${{ matrix.brand }} — building WITHOUT native push."
          fi

      - name: Generate launcher icons from the brand logo
        run: npx capacitor-assets generate --android

      - name: Sync web config into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk warehouse-${{ matrix.brand }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-${{ matrix.brand }}-apk
          path: mobile/warehouse-${{ matrix.brand }}.apk
          if-no-files-found: error

      - name: Attach APK to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/warehouse-${{ matrix.brand }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
