<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Warehouse Hub</title>
  <style>
    html,body{height:100%;margin:0;background:#0D1B2A;color:#e7edf5;
      font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      display:flex;align-items:center;justify-content:center;text-align:center}
    .wrap{padding:24px}
    .spin{width:42px;height:42px;margin:0 auto 18px;border:3px solid rgba(255,255,255,.2);
      border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    h1{font-size:18px;font-weight:700;margin:0 0 6px}
    p{font-size:13px;opacity:.7;margin:0}
  </style>
</head>
<body>
  <!--
    Native shell splash. When the app has network this screen is replaced by the
    live Warehouse Hub (loaded from the URL in capacitor.config.json). It only
    lingers if the device is offline — the shell always runs the latest deployed
    web app, so there is nothing to update here.
  -->
  <div class="wrap">
    <div class="spin"></div>
    <h1>Warehouse Hub</h1>
    <p>Connecting…</p>
  </div>
</body>
</html>
